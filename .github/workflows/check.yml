name: Nix checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: alejandra
            args: --check
          - tool: statix
            args: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
      - run: nix run --inputs-from path:./src nixpkgs-darwin#${{ matrix.tool }} -- ${{ matrix.args }} ./src

  flake-check:
    name: nix flake check
    needs: lint
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
      - run: nix flake check path:./src --no-write-lock-file --print-build-logs
